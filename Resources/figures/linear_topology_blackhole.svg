<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0d1b3e">LINEAR CHAIN TOPOLOGY</text>
  <text x="500" y="60" text-anchor="middle" font-size="14" fill="#5a6b8c">Blackhole Attack — as-formed structure (verified from parent_mac / verify_topology)</text>

  <!-- Layer guide bands -->
  <g stroke="#e3e8f2" stroke-width="1" stroke-dasharray="4 5">
    <line x1="60" y1="120" x2="940" y2="120"/>
    <line x1="60" y1="250" x2="940" y2="250"/>
    <line x1="60" y1="380" x2="940" y2="380"/>
    <line x1="60" y1="510" x2="940" y2="510"/>
  </g>
  <g font-size="11" font-weight="700" fill="#9aa7c2" text-anchor="start">
    <text x="60" y="105">LAYER 1</text>
    <text x="60" y="235">LAYER 2</text>
    <text x="60" y="365">LAYER 3</text>
    <text x="60" y="495">LAYER 4</text>
  </g>

  <!-- Connectors (drawn first, behind boxes) -->
  <g stroke="#8fa0c0" stroke-width="2.5" fill="none">
    <line x1="500" y1="150" x2="500" y2="195"/>            <!-- root -> node5 -->
    <path d="M500,285 C500,305 360,305 360,325"/>          <!-- node5 -> node4 -->
    <path d="M500,285 C500,305 640,305 640,325"/>          <!-- node5 -> node6 -->
    <path d="M360,415 C360,435 300,435 300,455"/>          <!-- node4 -> node3 -->
    <path d="M360,415 C360,435 470,435 470,455"/>          <!-- node4 -> node2 -->
  </g>

  <!-- Wi-Fi router feeding the root -->
  <line x1="230" y1="120" x2="425" y2="120" stroke="#8fa0c0" stroke-width="2" stroke-dasharray="5 4"/>
  <g transform="translate(150,98)">
    <rect x="0" y="0" width="80" height="44" rx="8" fill="#f1f4fa" stroke="#c3cde0"/>
    <circle cx="40" cy="16" r="3" fill="#5a6b8c"/>
    <path d="M32,16 a11,11 0 0 1 16,0 M28,20 a17,17 0 0 1 24,0" fill="none" stroke="#5a6b8c" stroke-width="2"/>
    <text x="40" y="38" text-anchor="middle" font-size="9" fill="#5a6b8c" font-weight="700">Wi-Fi Router</text>
  </g>

  <!-- Generated-dataset cylinder -->
  <g transform="translate(815,300)">
    <ellipse cx="45" cy="10" rx="45" ry="12" fill="#d7f0dd" stroke="#3ba85a"/>
    <path d="M0,10 v55 a45,12 0 0 0 90,0 v-55" fill="#e9f8ee" stroke="#3ba85a"/>
    <ellipse cx="45" cy="10" rx="45" ry="12" fill="#d7f0dd" stroke="#3ba85a"/>
    <text x="45" y="92" text-anchor="middle" font-size="11" fill="#2f7d45" font-weight="700">Generated Dataset</text>
  </g>

  <!-- ===== NODE BOXES ===== -->
  <!-- helper style: root=green, attacker=red, victim=blue -->

  <!-- ROOT  L1 -->
  <g>
    <rect x="425" y="90" width="150" height="60" rx="10" fill="#2fa84f" stroke="#1e7a38" stroke-width="2"/>
    <text x="500" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ROOT</text>
    <text x="500" y="131" text-anchor="middle" font-size="11" fill="#eafff0" font-family="Consolas, monospace">2805..D7B4</text>
    <text x="500" y="145" text-anchor="middle" font-size="10" fill="#d6f5e0">root · receiver / controller</text>
  </g>

  <!-- node5 BLACKHOLE  L2 -->
  <g>
    <rect x="425" y="220" width="150" height="60" rx="10" fill="#e05555" stroke="#b23b3b" stroke-width="2"/>
    <text x="500" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">NODE 5</text>
    <text x="500" y="261" text-anchor="middle" font-size="11" fill="#ffecec" font-family="Consolas, monospace">B0CB..3218</text>
    <text x="500" y="275" text-anchor="middle" font-size="10" fill="#ffdada" font-weight="700">BLACKHOLE (drops)</text>
  </g>

  <!-- node4  L3 -->
  <g>
    <rect x="285" y="350" width="150" height="60" rx="10" fill="#4a86d8" stroke="#2f5fa8" stroke-width="2"/>
    <text x="360" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">NODE 4</text>
    <text x="360" y="391" text-anchor="middle" font-size="11" fill="#eaf1fc" font-family="Consolas, monospace">B4BF..FE90</text>
    <text x="360" y="405" text-anchor="middle" font-size="10" fill="#d7e6fa">victim</text>
  </g>

  <!-- node6  L3 -->
  <g>
    <rect x="565" y="350" width="150" height="60" rx="10" fill="#4a86d8" stroke="#2f5fa8" stroke-width="2"/>
    <text x="640" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">NODE 6</text>
    <text x="640" y="391" text-anchor="middle" font-size="11" fill="#eaf1fc" font-family="Consolas, monospace">F42D..E618</text>
    <text x="640" y="405" text-anchor="middle" font-size="10" fill="#d7e6fa">victim</text>
  </g>

  <!-- node3  L4 -->
  <g>
    <rect x="225" y="480" width="150" height="60" rx="10" fill="#4a86d8" stroke="#2f5fa8" stroke-width="2"/>
    <text x="300" y="504" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">NODE 3</text>
    <text x="300" y="521" text-anchor="middle" font-size="11" fill="#eaf1fc" font-family="Consolas, monospace">704B..B768</text>
    <text x="300" y="535" text-anchor="middle" font-size="10" fill="#d7e6fa">victim</text>
  </g>

  <!-- node2  L4 -->
  <g>
    <rect x="395" y="480" width="150" height="60" rx="10" fill="#4a86d8" stroke="#2f5fa8" stroke-width="2"/>
    <text x="470" y="504" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">NODE 2</text>
    <text x="470" y="521" text-anchor="middle" font-size="11" fill="#eaf1fc" font-family="Consolas, monospace">B4BF..ED80</text>
    <text x="470" y="535" text-anchor="middle" font-size="10" fill="#d7e6fa">victim</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60,600)" font-size="12" fill="#33415c">
    <rect x="0" y="0" width="18" height="14" rx="3" fill="#2fa84f"/>
    <text x="24" y="11">Root</text>
    <rect x="95" y="0" width="18" height="14" rx="3" fill="#e05555"/>
    <text x="119" y="11">Attacker (blackhole)</text>
    <rect x="290" y="0" width="18" height="14" rx="3" fill="#4a86d8"/>
    <text x="314" y="11">Victim node</text>
  </g>
  <text x="940" y="611" text-anchor="end" font-size="10" fill="#9aa7c2">All victims address probes to Node 5; during attack it forwards none.</text>
</svg>
